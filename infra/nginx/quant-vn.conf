# Local-only HTTP by default. Configure a hostname and TLS before external access.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /opt/quant-vn/apps/web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
